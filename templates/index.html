<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduGenie — AI Learning Assistant</title>
    <link rel="stylesheet" href="{{ url_for('static', path='style.css') }}">
</head>
<body>
    <main class="app-shell">
        <section class="hero">
            <div>
                <p class="eyebrow">AI-POWERED LEARNING</p>
                <h1>EduGenie</h1>
                <p class="subtitle">
                    Ask, understand, summarize, quiz yourself, and build a learning path.
                </p>
            </div>
            <span id="healthBadge" class="badge">Checking API…</span>
        </section>

        <section class="card">
            <form id="eduForm">
                <label for="task">Choose a task</label>
                <select id="task" name="task">
                    <option value="qa">Question & Answer</option>
                    <option value="explain">Explain a Concept</option>
                    <option value="quiz">Generate Quiz</option>
                    <option value="summarize">Summarize</option>
                    <option value="learn">Recommend Learning Path</option>
                </select>

                <label for="model">Gemini Model</label>
                <select id="model" name="model">
                    <option value="">Auto (Recommended with Fallback)</option>
                    <option value="gemini-3.8-flash">Gemini 3.8 Flash</option>
                    <option value="gemini-flash-latest">Gemini Flash Latest</option>
                    <option value="gemini-3.7-flash">Gemini 3.7 Flash</option>
                    <option value="gemini-3.6-flash">Gemini 3.6 Flash</option>
                    <option value="gemini-flash-lite-latest">Gemini Flash Lite Latest</option>
                    <option value="gemini-3.5-flash-lite">Gemini 3.5 Flash Lite</option>
                </select>

                <label for="level" id="levelLabel" class="hidden">Learner level</label>
                <select id="level" class="hidden">
                    <option value="beginner">Beginner</option>
                    <option value="intermediate">Intermediate</option>
                    <option value="advanced">Advanced</option>
                </select>

                <label for="inputText">Your input</label>
                <textarea
                    id="inputText"
                    rows="10"
                    placeholder="Ask a question or paste educational text…"
                    required
                ></textarea>

                <button id="submitBtn" type="submit">Run EduGenie</button>
            </form>
        </section>

        <section id="resultCard" class="card result-card hidden">
            <div class="result-header">
                <h2>Result</h2>
                <button id="copyBtn" class="secondary" type="button">Copy</button>
            </div>
            <div id="result"></div>
        </section>

        <p id="error" class="error hidden"></p>
    </main>

    <script src="{{ url_for('static', path='app.js') }}"></script>
</body>
</html>
